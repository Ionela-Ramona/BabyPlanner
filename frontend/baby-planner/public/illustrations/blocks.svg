<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -6 114 106">
  <!-- Cele trei cuburi de lemn, motivul semnatura al produsului. Fiecare cub
       are fata din fata (culoarea familiei), fata de sus (nuanta "soft") si
       muchia laterala (nuanta "line"), pentru un volum discret.
       Hex-urile sunt exact treptele "fill/soft/line" din _tokens.scss (Paper). -->

  <!-- Cub miere, jos-stanga: stea -->
