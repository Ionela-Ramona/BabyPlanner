<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <!-- Aplica tema si fundalul salvate inainte sa porneasca Angular, ca pagina sa nu clipeasca
       in culorile gresite. Lista de fundaluri trebuie sa ramana aceeasi cu BACKGROUNDS din theme.ts. -->
  <script>(function(){try{var d=document.documentElement,t=localStorage.getItem('bp-theme'),b=localStorage.getItem('bp-background');if(t==='light'||t==='dark'){d.setAttribute('data-theme',t);}if(b==='rose'||b==='mint'||b==='sky'||b==='lavender'){d.setAttribute('data-background',b);}}catch(e){}})();</script>
  <title>BabyPlanner</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Jurnalul zilnic al bebelușului: mese, somn, scutece și medicamente, notate în câteva secunde.">
  <meta name="theme-color" content="#F9EFE5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2A221E" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Fontul textului e cerut abia dupa CSS; preload il aduce in paralel cu el. -->
  <link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <app-root></app-root>
</body>
</html>
