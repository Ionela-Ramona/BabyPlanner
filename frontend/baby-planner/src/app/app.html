<!-- Primul element focusabil din pagina: sare peste antet, direct la continut.
     Utilizatorii de tastatura nu mai trebuie sa treaca prin navigare la fiecare pagina. -->
<a class="skip-link" href="#continut">Sari la conținut</a>

<header class="app-header">
  <div class="app-header__inner">
    <a class="brand" routerLink="/dashboard">
      <span class="brand__mark" aria-hidden="true">🍼</span>
      <span class="brand__name">BabyPlanner</span>
    </a>

    <app-nav-bar />
  </div>
</header>

<!-- tabindex="-1" face <main> focusabil programatic, ca skip-link-ul sa aiba unde ateriza. -->
<main id="continut" class="app-main" tabindex="-1">
  <router-outlet />
</main>

<footer class="app-footer">
  <p class="text-muted">Proiect de învățare — .NET 8 Web API + Angular {{ angularVersion }}</p>
</footer>
