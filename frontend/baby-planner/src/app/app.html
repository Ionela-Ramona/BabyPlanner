<!-- Primul element focusabil din pagina: sare peste antet, direct la continut.
     Utilizatorii de tastatura nu mai trebuie sa treaca prin navigare la fiecare pagina. -->
<!-- (click) e necesar: cu <base href="/">, "#continut" inseamna "/#continut", deci
     browserul ar reincarca aplicatia (si ar pierde pagina curenta) in loc sa sara. -->
<a class="skip-link" href="#continut" (click)="skipToContent($event)">Sari la conținut</a>

<header class="topbar">
  <a class="topbar__home" routerLink="/dashboard" aria-label="BabyPlanner, pagina Azi">
    <app-wordmark [compact]="narrow()" />
  </a>

  <div class="topbar__tools">
    <app-baby-switcher />
    <app-background-button />
    <app-theme-toggle />
  </div>
</header>

<!-- tabindex="-1" face <main> focusabil programatic, ca skip-link-ul (si mutarea
     focusului dupa navigare) sa aiba unde ateriza. -->
<main id="continut" class="app-main" [class.app-main--wide]="wide()" tabindex="-1" #main>
  <router-outlet />
</main>

<app-main-nav class="app-nav" />

<app-toast-outlet />
